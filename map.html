<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duminda — Full Journey Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#map{position:absolute;inset:0;z-index:1}
#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(10,13,22,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
#topbar h1{font-size:13px;font-weight:600;color:#d0e4ff;white-space:nowrap}
#topbar p{font-size:11px;color:#3a5080;white-space:nowrap}
.sep{flex:1}
.tbtn{font-size:11px;padding:5px 11px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#5a7aaa;cursor:pointer;transition:all .15s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.09);color:#a0c0ff}
.tbtn.on{background:rgba(80,140,255,.18);border-color:rgba(80,140,255,.4);color:#80bfff}
#anim-btn{background:rgba(60,180,100,.12);border-color:rgba(60,180,100,.3);color:#50c070}
#anim-btn.playing{background:rgba(200,70,70,.14);border-color:rgba(200,70,70,.3);color:#ff6060}
#timeline{position:absolute;bottom:0;left:0;right:0;z-index:1000;padding:9px 16px 11px;background:rgba(10,13,22,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06)}
#tl-inner{display:flex;align-items:center;gap:10px}
#tl-date{font-size:12px;font-weight:500;color:#60a0ff;min-width:78px}
#slider{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.12);outline:none;cursor:pointer}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#5090ff;border:2px solid #fff;cursor:pointer;box-shadow:0 0 6px rgba(80,150,255,.5)}
#tl-prog{font-size:11px;color:#304060;min-width:52px;text-align:right}
#stats{position:absolute;top:52px;right:12px;z-index:1000;width:195px}
.scard{background:rgba(10,13,22,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.scard h3{font-size:9px;font-weight:600;color:#2a4060;letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase}
.srow{display:flex;justify-content:space-between;margin-bottom:4px}
.sl{font-size:11px;color:#3a5070}
.sv{font-size:11px;font-weight:600;color:#80b0ff}
.hbar-wrap{width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-bottom:6px}
.hbar{height:3px;border-radius:2px}
#legend{position:absolute;bottom:46px;left:12px;z-index:1000;background:rgba(10,13,22,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 13px}
#legend h3{font-size:9px;color:#2a4060;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.li{display:flex;align-items:center;gap:7px;font-size:11px;color:#3a5070;margin-bottom:5px}
.li:last-child{margin-bottom:0}
.lc{border-radius:50%;flex-shrink:0}
.ll{height:2.5px;width:22px;border-radius:2px;flex-shrink:0}
#dotinfo{position:absolute;top:52px;left:12px;z-index:1000;background:rgba(10,13,22,.9);backdrop-filter:blur(8px);border:1px solid rgba(64,220,100,.2);border-radius:10px;padding:10px 13px;display:none;max-width:215px}
.di-d{font-size:9px;color:#2a6040;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.di-l{font-size:13px;font-weight:600;color:#50ff80;margin-bottom:2px}
.di-t{font-size:10px;color:#2a4055;line-height:1.4}
#tooltip{position:absolute;z-index:2000;background:rgba(10,13,22,.95);border:1px solid rgba(80,140,255,.3);border-radius:7px;padding:8px 11px;font-size:12px;color:#b0d0ff;pointer-events:none;display:none;max-width:200px;line-height:1.5}
</style>
</head>
<body>
<div id="topbar">
  <h1>Duminda — Full Journey</h1>
  <p>363 stops · Jul 2023 – Mar 2026</p>
  <div class="sep"></div>
  <button class="tbtn on" onclick="setYear('all',this)">All</button>
  <button class="tbtn" onclick="setYear('2024',this)">2024</button>
  <button class="tbtn" onclick="setYear('2025',this)">2025</button>
  <button class="tbtn" onclick="setYear('2026',this)">2026</button>
  <button class="tbtn on" id="hbtn" onclick="toggleHeat(this)">Heatmap</button>
  <button class="tbtn on" id="pbtn" onclick="togglePath(this)">Path</button>
  <button class="tbtn" id="tbtn" onclick="toggleTransaction(this)">Transaction Map</button>
  <button class="tbtn" id="anim-btn" onclick="toggleAnim()">▶ Play journey</button>
</div>

<div id="map"></div>

<div id="dotinfo">
  <div class="di-d" id="did"></div>
  <div class="di-l" id="dil"></div>
  <div class="di-t" id="dit"></div>
</div>

<div id="stats">
  <div class="scard">
    <h3>Top locations</h3>
    <div id="top-locs"></div>
  </div>
  <div class="scard">
    <h3>City split</h3>
    <div class="srow"><span class="sl">Colombo</span><span class="sv">235</span></div>
    <div class="srow"><span class="sl">Monaragala</span><span class="sv">80</span></div>
    <div class="srow"><span class="sl">Kandy</span><span class="sv">10</span></div>
    <div class="srow"><span class="sl">Other</span><span class="sv">38</span></div>
  </div>
</div>

<div id="legend">
  <h3>Legend</h3>
  <div class="li"><div class="ll" style="background:linear-gradient(90deg,#1a2a60,#4080ff)"></div>Path (west = Colombo)</div>
  <div class="li"><div class="ll" style="background:linear-gradient(90deg,#602010,#d06020)"></div>Path (east = Monaragala)</div>
  <div class="lc" style="width:0"></div>
  <div class="li"><div class="lc" style="width:18px;height:18px;background:rgba(255,60,60,.7);border:1.5px solid #ff4040"></div>Spend &gt; LKR 100K</div>
  <div class="li"><div class="lc" style="width:14px;height:14px;background:rgba(255,140,30,.7);border:1.5px solid #ff9020"></div>LKR 30–100K</div>
  <div class="li"><div class="lc" style="width:11px;height:11px;background:rgba(255,210,30,.65);border:1.5px solid #ffcc20"></div>LKR 10–30K</div>
  <div class="li"><div class="lc" style="width:8px;height:8px;background:rgba(60,120,255,.7);border:1.5px solid #4080ff"></div>Under LKR 10K</div>
  <div class="li"><div class="lc" style="width:10px;height:10px;background:#40ff80;border:1.5px solid #fff"></div>Animated position</div>
</div>

<div id="timeline">
  <div id="tl-inner">
    <span id="tl-date">2023-11-01</span>
    <input type="range" id="slider" min="0" max="362" value="0" oninput="onSlider(+this.value)">
    <span id="tl-prog">1 / 363</span>
  </div>
</div>

<div id="tooltip"></div>

    const age=i/data.length;
    layers.push(L.polyline([[a.la,a.ln],[b.la,b.ln]],{
      color:pCol(a),weight:2.2,opacity:0.12+age*0.58,smoothFactor:1.5,interactive:false
    }));
  }
  pathGrp=L.layerGroup(layers).addTo(map);
}

function drawHeat(){
  if(heatGrp){map.removeLayer(heatGrp);heatGrp=null;}
  if(!showH)return;
  const layers=[];
  H.forEach(h=>{
    const r=hRad(h.v),c=hCol(h.sp);
    // Glow
    layers.push(L.circle([h.la,h.ln],{radius:r*22,color:'transparent',fillColor:c.s,fillOpacity:0.05,interactive:false}));
    // Main
    const circ=L.circle([h.la,h.ln],{radius:r*9,color:c.s,weight:1.5,fillColor:c.f,fillOpacity:0.78});
    circ.bindPopup(`<b>${h.n}</b><br>${h.v} visits · LKR ${h.sp.toLocaleString()} spent`,{maxWidth:200});
    circ.on('mouseover',function(e){
      const t=document.getElementById('tooltip');
      t.innerHTML=`<b style="color:#80c0ff">${h.n}</b><br><span style="color:#3a6080">${h.v} visits &nbsp;·&nbsp; LKR ${h.sp.toLocaleString()}</span>`;
      t.style.display='block';t.style.left=(e.originalEvent.clientX+12)+'px';t.style.top=(e.originalEvent.clientY-8)+'px';
    });
    circ.on('mousemove',function(e){
      const t=document.getElementById('tooltip');t.style.left=(e.originalEvent.clientX+12)+'px';t.style.top=(e.originalEvent.clientY-8)+'px';
    });
    circ.on('mouseout',()=>{document.getElementById('tooltip').style.display='none';});
    layers.push(circ);
    // Label for top locs
    if(h.v>=10){
      const lbl=L.divIcon({className:'',html:`<div style="font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none;margin-left:${r*9/111111*6500+5}px">${h.n.split(',')[0]}<br><span style="font-size:9px;color:rgba(255,255,255,.5)">${h.v}× · LKR ${(h.sp/1000).toFixed(0)}K</span></div>`,iconAnchor:[0,10]});
      layers.push(L.marker([h.la,h.ln],{icon:lbl,interactive:false}));
    }
  });
  heatGrp=L.layerGroup(layers).addTo(map);
}

function clearDot(){
  if(dotMark){map.removeLayer(dotMark);dotMark=null;}
  if(trailPoly){map.removeLayer(trailPoly);trailPoly=null;}
}

function placeDot(i){
  clearDot();
  const p=curData[i];if(!p)return;
  const icon=L.divIcon({className:'',html:'<div style="width:13px;height:13px;border-radius:50%;background:#40ff80;border:2px solid #fff;box-shadow:0 0 10px rgba(64,255,128,.8),0 0 20px rgba(64,255,128,.35)"></div>',iconSize:[13,13],iconAnchor:[6,6]});
  dotMark=L.marker([p.la,p.ln],{icon,zIndexOffset:2000,interactive:false}).addTo(map);
  if(i>0){
    const trail=curData.slice(Math.max(0,i-20),i+1).map(x=>[x.la,x.ln]);
    trailPoly=L.polyline(trail,{color:'#40ff80',weight:1.8,opacity:0.55,dashArray:'5 4',interactive:false}).addTo(map);
  }
  document.getElementById('did').textContent=p.d;
  document.getElementById('dil').textContent=p.n;
  document.getElementById('dit').textContent=p.t;
  document.getElementById('dotinfo').style.display='block';
  document.getElementById('tl-date').textContent=p.d;
  document.getElementById('tl-prog').textContent=(i+1)+' / '+curData.length;
  document.getElementById('slider').value=i;
}

function onSlider(v){
  animIdx=v;
  if(v===0&&!playing){
    clearDot();
    document.getElementById('dotinfo').style.display='none';
    document.getElementById('tl-date').textContent=curData[0]?.d||'';
    document.getElementById('tl-prog').textContent='— / '+curData.length;
    return;
  }
  placeDot(v);
}

function toggleAnim(){
  if(playing){
    clearInterval(animTmr);animTmr=null;playing=false;
    document.getElementById('anim-btn').textContent='▶ Play journey';
    document.getElementById('anim-btn').classList.remove('playing');
  } else {
    if(animIdx>=curData.length-1)animIdx=0;
    playing=true;
    document.getElementById('anim-btn').textContent='⏹ Stop';
    document.getElementById('anim-btn').classList.add('playing');
    animTmr=setInterval(()=>{
      if(animIdx>=curData.length){
        clearInterval(animTmr);playing=false;
        document.getElementById('anim-btn').textContent='▶ Play journey';
        document.getElementById('anim-btn').classList.remove('playing');
        return;
      }
      placeDot(animIdx++);
    },75);
  }
}

function setYear(y,btn){
  document.querySelectorAll('[onclick^="setYear"]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(playing)toggleAnim();
  clearDot();
  document.getElementById('dotinfo').style.display='none';
  animIdx=0;
  curData=y==='all'?P:P.filter(p=>p.d.startsWith(y));
  const sl=document.getElementById('slider');
  sl.max=curData.length-1;sl.value=0;
  document.getElementById('tl-date').textContent=curData[0]?.d||'';
  document.getElementById('tl-prog').textContent='— / '+curData.length;
  drawPath(curData);
}

function toggleHeat(btn){
  showH=!showH;btn.textContent=showH?'Heatmap':'Heatmap off';btn.classList.toggle('on',showH);drawHeat();
}
function togglePath(btn){
  showP=!showP;btn.textContent=showP?'Path':'Path off';btn.classList.toggle('on',showP);drawPath(curData);
}
function toggleTransaction(btn){
  const isOn=btn.classList.toggle('on');
  btn.textContent=isOn?'Transaction Map':'Transaction Map off';
  // Transaction map functionality can be added here
  if(isOn){
    console.log('Transaction Map enabled');
  }else{
    console.log('Transaction Map disabled');
  }
}

// Top locations panel
function buildTop(){
  const maxV=H[0].v;
  document.getElementById('top-locs').innerHTML=H.slice(0,6).map(h=>{
    const c=hCol(h.sp);
    return`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span class="sl" style="font-size:10px">${h.n.split(',')[0]}</span><span class="sv" style="font-size:10px">${h.v}×</span></div><div class="hbar-wrap"><div class="hbar" style="width:${Math.round(h.v/maxV*100)}%;background:${c.s}"></div></div></div>`;
  }).join('');
}

// Init
drawPath(curData);
drawHeat();
buildTop();
document.getElementById('slider').max=P.length-1;
document.getElementById('slider').value=0;
document.getElementById('tl-date').textContent=P[0].d;
document.getElementById('tl-prog').textContent='— / '+P.length;
</script>
</body>
</html>
